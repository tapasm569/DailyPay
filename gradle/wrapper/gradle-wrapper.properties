package com.dailypay.app.ui.components

import androidx.compose.foundation.background
import androidx.compose.foundation.border
import androidx.compose.foundation.layout.*
import androidx.compose.foundation.shape.RoundedCornerShape
import androidx.compose.material3.MaterialTheme
import androidx.compose.material3.Text
import androidx.compose.runtime.Composable
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.draw.clip
import androidx.compose.ui.graphics.Brush
import androidx.compose.ui.graphics.Color
import androidx.compose.ui.unit.dp
import com.dailypay.app.ui.theme.MoneyGreen
import com.dailypay.app.ui.theme.AlertOrange

@Composable
fun HeroSummaryCard(
    pendingDue: String,
    receivedPayment: String,
    modifier: Modifier = Modifier
) {
    Box(
        modifier = modifier
            .fillMaxWidth()
            .clip(RoundedCornerShape(24.dp))
            .background(
                Brush.linearGradient(
                    colors = listOf(Color(0xFF1E1B4B), Color(0xFF312E81)) // Sleek dark indigo gradient
                )
            )
            .padding(20.dp)
    ) {
        Column(modifier = Modifier.fillMaxWidth()) {
            Text(
                text = "Today's Collection Overview",
                style = MaterialTheme.typography.bodyMedium,
                color = Color(0xFFC7D2FE)
            )

            Spacer(modifier = Modifier.height(16.dp))

            Row(
                modifier = Modifier.fillMaxWidth(),
                horizontalArrangement = Arrangement.SpaceBetween,
                verticalAlignment = Alignment.CenterVertically
            ) {
                // Pending Due Pod
                Column {
                    Text(
                        text = "Pending Due",
                        style = MaterialTheme.typography.labelMedium,
                        color = Color(0xFFFDE68A)
                    )
                    Text(
                        text = "₹$pendingDue",
                        style = MaterialTheme.typography.displayMedium,
                        color = Color.White
                    )
                }

                // Divider line
                Box(
                    modifier = Modifier
                        .height(44.dp)
                        .width(1.dp)
                        .background(Color(0xFF4338CA))
                )

                // Received Payment Pod
                Column(horizontalAlignment = Alignment.End) {
                    Text(
                        text = "Received Today",
                        style = MaterialTheme.typography.labelMedium,
                        color = Color(0xFFA7F3D0)
                    )
                    Text(
                        text = "₹$receivedPayment",
                        style = MaterialTheme.typography.displayMedium,
                        color = MoneyGreen
                    )
                }
            }
        }
    }
}
